name: taskly
description: Internal startup task management for Android and iOS.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^16.2.0
  supabase_flutter: ^2.10.0
  firebase_core: ^4.1.0
  cloud_firestore: ^6.9.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.3.0
  intl: ^0.20.2
  file_picker: ^10.3.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  collection: ^1.19.1
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.5
  mime: ^2.0.0
  timeago: ^3.7.1
  path: ^1.9.1
  fl_chart: ^1.2.0
  table_calendar: ^3.2.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  awesome_notifications: ^0.12.1
  open_file: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.15
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
